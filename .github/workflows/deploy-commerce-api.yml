name: Deploy commerce-api

on:
  push:
    branches: [main]
    paths:
      - 'services/commerce-api/**'
      - 'packages/shared-types/**'
      - 'infra/terraform/**'
      - '.github/workflows/deploy-commerce-api.yml'

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: africa-south1
  SERVICE: commerce-api-dev

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/commerce-api/commerce-api:${{ github.sha }}"
          docker build -f services/commerce-api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Run migrations
        run: |
          # Cloud SQL Auth Proxy: connect to private instance from CI runner.
          # See: https://cloud.google.com/sql/docs/postgres/connect-auth-proxy
          # Spelled out so that future engineers can find this when migrations break.
          # For now, this step is a placeholder — flesh out once Cloud SQL is provisioned.
          echo "TODO: run pnpm --filter commerce-api migrate against Cloud SQL via the Auth Proxy"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image="${IMAGE}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --quiet
